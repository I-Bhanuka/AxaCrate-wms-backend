# Application Name
spring.application.name=wms-application

# Server Configuration
server.port=8080

#Active the local profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local} 
# This will default to 'local' if SPRING_PROFILES_ACTIVE is not set in the environment

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rfid_wms
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (shared for development)
jwt.secret=RfidWmsDevSecretKey2024MustBeAtLeast256BitsLongForHS256AlgorithmSecure
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.rfidwms=DEBUG